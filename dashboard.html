<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Mantenimiento Minero</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <div id="loading" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Cargando dashboard...</p>
    </div>

    <div id="dashboard" class="dashboard-section" style="display: none;">

        <header class="exec-header">
            <div class="exec-title">
                <div class="exec-logo"><i class="fas fa-screwdriver-wrench"></i></div>
                <div>
                    <h1>Dashboard Mantenimiento Minero</h1>
                    <span class="exec-subtitle">Parada de Planta · Análisis Integral</span>
                </div>
            </div>
            <div class="exec-actions">
                <span class="exec-date">
                    <i class="fas fa-calendar-alt"></i>
                    <span id="fechaActual"></span>
                </span>
            </div>
        </header>

        <!-- KPIs -->
        <section class="kpi-row" id="kpiRow"></section>

        <!-- Filtros -->
        <section class="filters-row">
            <div class="filter-chip">
                <i class="fas fa-industry"></i>
                <select id="filterProceso" class="filter-select"><option value="">Proceso</option></select>
            </div>
            <div class="filter-chip">
                <i class="fas fa-layer-group"></i>
                <select id="filterSubProceso" class="filter-select"><option value="">Sub-Proceso</option></select>
            </div>
            <div class="filter-chip">
                <i class="fas fa-building"></i>
                <select id="filterEmpresa" class="filter-select"><option value="">Empresa</option></select>
            </div>
            <div class="filter-chip">
                <i class="fas fa-user-tie"></i>
                <select id="filterSupervisor" class="filter-select"><option value="">Supervisor</option></select>
            </div>
            <div class="filter-chip">
                <i class="fas fa-exclamation-triangle"></i>
                <select id="filterCriticidad" class="filter-select"><option value="">Criticidad</option></select>
            </div>
            <button id="clearFilters" class="btn-clear-chips">
                <i class="fas fa-eraser"></i> Limpiar
            </button>
        </section>

        <!-- Gráficos -->
        <section class="charts-exec" id="chartsGrid"></section>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
