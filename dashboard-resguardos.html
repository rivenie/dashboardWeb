<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Resguardos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="dash-tabs">
        <a href="dashboard-delivery.html" class="tab"><i class="fas fa-box"></i> Delivery</a>
        <a href="dashboard-transporte.html" class="tab"><i class="fas fa-truck"></i> Transporte</a>
        <a href="dashboard-rutas.html" class="tab"><i class="fas fa-route"></i> Hojas de Ruta</a>
        <a href="dashboard-resguardos.html" class="tab active"><i class="fas fa-shield"></i> Resguardos</a>
    </nav>

    <div id="loading" class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Cargando dashboard...</p>
    </div>

    <div id="dashboard" class="dashboard-section" style="display: none;">
        <header class="exec-header">
            <div class="exec-title">
                <div class="exec-logo"><i class="fas fa-shield"></i></div>
                <div>
                    <h1>Dashboard Resguardos</h1>
                    <span class="exec-subtitle">Servicio de seguridad</span>
                </div>
            </div>
            <div class="exec-actions">
                <span class="exec-date"><i class="fas fa-calendar-alt"></i> <span id="fechaActual"></span></span>
            </div>
        </header>

        <section class="kpi-row" id="kpiRow"></section>

        <section class="filters-row">
            <div class="filter-chip"><i class="fas fa-calendar-day"></i><input type="date" id="filterFecha" class="filter-input"></div>
            <div class="filter-chip"><i class="fas fa-truck"></i><select id="filterProveedor" class="filter-select"><option value="">Proveedor</option></select></div>
            <div class="filter-chip"><i class="fas fa-users"></i><select id="filterCliente" class="filter-select"><option value="">Cliente</option></select></div>
            <div class="filter-chip"><i class="fas fa-shield"></i><select id="filterResguardo" class="filter-select"><option value="">Tipo Resguardo</option></select></div>
            <button id="clearFilters" class="btn-clear-chips"><i class="fas fa-eraser"></i> Limpiar</button>
        </section>

        <section class="charts-exec" id="chartsGrid"></section>
    </div>

    <script src="js/dashboard.js"></script>
    <script>document.addEventListener('DOMContentLoaded', iniciarDashboardResguardos);</script>
</body>
</html>
